          <defs>
            <linearGradient id="brandGradLp" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#22d3ee" /><stop offset="1" stop-color="#6366f1" />

          </defs>
          <rect width="32" height="32" rx="9" fill="url(#brandGradLp)" />
          <g fill="#fff">
            <rect x="7" y="7" width="8" height="8" rx="2.6" opacity="0.95" />
            <rect x="17" y="7" width="8" height="8" rx="2.6" opacity="0.6" />
            <rect x="7" y="17" width="8" height="8" rx="2.6" opacity="0.6" />

        <span class="brand-text"><span data-i18n="demos.brand">实验场</span><span class="dim">/lab</span></span>

      <nav class="header-nav">

        <a href="apps.html" data-i18n="nav.apps">站点入口</a>

        </a>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="切换主题"></button>
      </nav>
    </div>
  </header>

  <main>
    <section class="lab-hero">
      <div class="wrap">
        <p class="kicker" data-i18n="demos.kicker">DEMOS</p>
        <h1 data-i18n="demos.title">实验场 · 一些能立刻跑起来的 Demo</h1>

      </div>
    </section>

    <section class="wrap">
      <div class="toolbar lab-toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M10.5 18a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15Zm4.6-2.9L20 20"/></svg>
          <input id="demoSearch" type="search" data-i18n-ph="demos.search" placeholder="筛选 Demo…" autocomplete="off" />
        </label>
        <p class="lab-count" id="demoCount"></p>
      </div>
      <div class="lp-grid lab-grid" id="demoGrid"></div>
      <p class="empty" id="demoEmpty" data-i18n="demos.empty" hidden>没有匹配的 Demo</p>

  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>© <span id="year"></span> 456wyc · <a href="index.html" style="text-decoration:underline;text-underline-offset:3px" data-i18n="demos.back">返回首页</a></span>

  <script src="assets/js/i18n.js"></script>
  <script src="data/demos.js"></script>
  <script src="assets/js/demos.js"></script>
  <script>
    window.initThemeToggle();
    const renderDemosPage = () => window.renderDemos({
      grid: '#demoGrid', search: '#demoSearch', empty: '#demoEmpty', count: '#demoCount'
    });
    renderDemosPage();
    document.addEventListener('localechange', renderDemosPage);
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
  <script src="assets/js/stats.js"></script>
