  sw.addEventListener('pointermove',e=>{if(e.pointerId===sid)setH(e.clientX)});
  sw.addEventListener('pointerup',endH);sw.addEventListener('pointercancel',endH);sw.addEventListener('lostpointercapture',endH);

  /* 纵向油门/刹车：向上滑给油，向下滑刹车/倒车，松手回中同时松开 */
  let vid=null,vrect=null;
  const setV=y=>{
    if(!vrect)return;
    const v=Math.max(-1,Math.min(1,((vrect.top+vrect.height/2)-y)/(vrect.height/2)));
    const gas=v>0.12,brk=v<-0.12;
    K.KeyW=gas?1:0;K.KeyS=brk?1:0;
    tv.classList.toggle('gas',gas);tv.classList.toggle('brk',brk);
    vn.style.transform='translateY('+(-v*(vrect.height/2-19))+'px)';
  };
  const endV=e=>{if(vid!==null&&e.pointerId!==vid)return;vid=null;K.KeyW=0;K.KeyS=0;tv.classList.remove('on','gas','brk');vn.style.transform='translateY(0)'};
  tv.addEventListener('pointerdown',e=>{e.preventDefault();try{tv.setPointerCapture(e.pointerId)}catch(_){}vid=e.pointerId;vrect=tv.getBoundingClientRect();tv.classList.add('on');setV(e.clientY);au()});
  tv.addEventListener('pointermove',e=>{if(e.pointerId===vid)setV(e.clientY)});
  tv.addEventListener('pointerup',endV);tv.addEventListener('pointercancel',endV);tv.addEventListener('lostpointercapture',endV);

  apply();
  /* 键盘设备上出现真实触摸输入时，自动切到对应触屏模式 */
  document.addEventListener('pointerdown',e=>{
    if(override||urlForced||e.defaultPrevented)return;
    if(e.pointerType==='touch'&&cur.mode==='keyboard'){override=touchDevice();apply()}
  });
})();
/* ---------- 全屏：手机也能开启浏览器原生全屏 ---------- */
(function(){
  const b=document.getElementById('fsBtn'),tip=document.getElementById('fsTip'),el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
  const cur=()=>document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement;
  let timer=null;
  function showTip(msg){
    tip.textContent=msg;tip.hidden=false;
    clearTimeout(timer);timer=setTimeout(()=>{tip.hidden=true},4500);
  }
  function sync(){
    const on=!!cur();
    b.textContent=on?'退出全屏':'全屏';
    b.setAttribute('aria-label',b.textContent);
    b.classList.toggle('on',on);
  }
  function exitFs(){
    const fn=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
    if(!fn)return Promise.resolve();
    try{return fn.call(document)||Promise.resolve()}catch(e){return Promise.resolve()}
  }
  if(!req){
    b.addEventListener('click',()=>showTip('当前浏览器不支持网页全屏。iPhone 请在 Safari 点「分享 → 添加到主屏幕」，再从桌面图标打开即可全屏运行。'));
    return;
  }
  b.addEventListener('click',()=>{
    let p;
    try{p=cur()?exitFs():req.call(el)}catch(e){p=Promise.reject(e)}
    if(p&&p.catch)p.catch(()=>showTip('浏览器拒绝了全屏请求。请改用系统浏览器直接打开本页（不要用 App 内嵌浏览器）；iPhone 可「添加到主屏幕」后全屏运行。'));
  });
  document.addEventListener('fullscreenchange',sync);
  document.addEventListener('webkitfullscreenchange',sync);
  document.addEventListener('MSFullscreenChange',sync);
  sync();
})();
